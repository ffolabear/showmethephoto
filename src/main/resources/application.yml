spring:
  application:
    name: showmethephoto

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 3600
  storage:
    photo-dir: ${PHOTO_STORAGE_DIR:./uploads/photos}